name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua plugin spec

  busted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: rfc.nvim
      # the house library beside the plugin, at its main as lazy.lua
      # tracks it, where .busted looks for it
      - uses: actions/checkout@v7
        with:
          repository: cds-io/cds-lua
          path: cds-lua
      - uses: actions/checkout@v7
        with:
          repository: cds-io/cds-lua-fp
          path: cds-lua-fp
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v6
      - name: Install busted
        run: luarocks install busted
      - name: Test
        run: make test
        working-directory: rfc.nvim

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: rfc.nvim
      # mini.doc beside the plugin, where the Makefile looks first
      - uses: actions/checkout@v7
        with:
          repository: nvim-mini/mini.doc
          path: mini.doc
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Help file is current
        run: make doc-check
        working-directory: rfc.nvim

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: rfc.nvim
      - uses: actions/checkout@v7
        with:
          repository: cds-io/cds-lua
          path: cds-lua
      - uses: actions/checkout@v7
        with:
          repository: cds-io/cds-lua-fp
          path: cds-lua-fp
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly # the runtime types the plugin is written against (vim.async is 0.13+)
      - run: |
          curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz | tar xz -C "$HOME"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Type check
        run: make typecheck
        working-directory: rfc.nvim

  selene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install selene
        run: cargo install selene --locked
      - name: Lint
        run: make lint
