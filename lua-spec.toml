# Settings for lua-spec, the architecture checker beside this checkout
# (make architecture-check): the module prefix whose lua/rfc.lua and
# lua/rfc/init.lua are the public facade, the lines a production module may
# run to, and the pure core, whose modules neither name vim nor import a
# module outside it.
[architecture]
plugin = "rfc"
limit = 200
pure = [
    "lua/rfc/cache/rules.lua",
    "lua/rfc/dates.lua",
    "lua/rfc/document",
    "lua/rfc/format",
    "lua/rfc/help",
    "lua/rfc/help_rfc",
    "lua/rfc/help_bip.lua",
    "lua/rfc/help_eip.lua",
    "lua/rfc/help_simd.lua",
    "lua/rfc/help_w3c.lua",
    "lua/rfc/needs.lua",
    "lua/rfc/outline.lua",
    "lua/rfc/proposal",
    "lua/rfc/source",
    "lua/rfc/status.lua",
    "lua/rfc/subjects.lua",
    "lua/rfc/tables.lua",
]
